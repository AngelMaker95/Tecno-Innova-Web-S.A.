<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNOINNOVA S.A. - Panel de Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="container animate-fade-in">
            <h1>TECNOINNOVA S.A.</h1>
            <p>Sistema de Gestión de Base de Datos - Cátedra: Base de Datos I</p>
        </div>
    </header>

    <main class="container">
        
        <section id="auth-section" class="card animate-slide-up">
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Crear Usuario</button>
            </div>

            <form id="login-form" class="auth-form">
                <h3>Ingreso al Sistema</h3>
                <div class="form-group">
                    <label for="login-username">Usuario:</label>
                    <input type="text" id="login-username" placeholder="Ej: angel_admin" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <form id="register-form" class="auth-form hidden">
                <h3>Registro de Nuevo Usuario</h3>
                <div class="form-group">
                    <label for="reg-username">Nombre de Usuario:</label>
                    <input type="text" id="reg-username" placeholder="Ej: nuevo_tecnico" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
                </div>
                <button type="submit" class="btn-secondary">Registrar Cuenta</button>
            </form>
            <p id="auth-message" class="message"></p>
        </section>

<section id="dashboard-section" class="card hidden">
    <div class="dashboard-header">
        <h2>Panel de Control - TecnoInnova S.A.</h2>
        <p>Bienvenido, <span id="user-display" class="highlight"></span> | <a href="#" onclick="logout()">Cerrar Sesión</a></p>
    </div>

    <div class="table-selector">
        <button onclick="changeTable('clientes')" id="btn-tab-clientes" class="btn-tab active">Clientes</button>
        <button onclick="changeTable('productos')" id="btn-tab-productos" class="btn-tab">Productos</button>
        <button onclick="changeTable('pedidos')" id="btn-tab-pedidos" class="btn-tab">Pedidos</button>
        <button onclick="changeTable('tecnicos')" id="btn-tab-tecnicos" class="btn-tab">Técnicos</button>
    </div>

    <div class="main-dashboard-layout">
        <div class="table-container">
            <div id="client-message" class="message"></div>
            <table class="data-table">
                <thead id="dynamic-table-head">
                    </thead>
                <tbody id="clientes-table-body">
                    </tbody>
            </table>
        </div>
    </div>
</section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 - Diseño de Base de Datos I. Desarrollado por Ángel Jiménez.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
